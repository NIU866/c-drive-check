name: Publish Windows portable build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and build
        shell: pwsh
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller==6.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --onefile --windowed --name DiskSpaceLens disk_lens.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath dist\DiskSpaceLens.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw 'The application did not stay open.' }
          } finally {
            if (-not $app.HasExited) { taskkill /PID $app.Id /T /F }
          }
          Compress-Archive -Path dist\DiskSpaceLens.exe,README.md -DestinationPath DiskSpaceLens-windows-x64.zip
          $hash = (Get-FileHash DiskSpaceLens-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DiskSpaceLens-windows-x64.zip" | Set-Content -Encoding ascii checksums.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 DiskSpaceLens-windows-x64.zip checksums.txt --target $env:GITHUB_SHA --title "Disk Space Lens v1.0.0" --notes "Portable Windows x64 application. Unzip and open DiskSpaceLens.exe. File sizes are scanned locally in read-only mode."
